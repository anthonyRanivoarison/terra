name: terra

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-terra}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  migrate:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/terra-migrate:${TERRA_TAG:-latest}
    restart: "no"
    environment:
      DATABASE_URL: &db postgres://${POSTGRES_USER:-terra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-terra}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
    depends_on:
      postgres:
        condition: service_healthy

  ingest:
    image: ghcr.io/${GHCR_OWNER}/terra-ingest:${TERRA_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: *db
      INGEST_PORT: 4000
      ASN_DB_PATH: ${ASN_DB_PATH:-}
    volumes:
      - ./data:/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/${GHCR_OWNER}/terra-web:${TERRA_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: *db
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      TERRA_FREE_EVENTS_QUOTA: ${TERRA_FREE_EVENTS_QUOTA:-}
      PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
      PADDLE_BILLING_WEBHOOK_SECRET: ${PADDLE_BILLING_WEBHOOK_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  cron:
    image: postgres:17
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/infra/cron.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-terra}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-terra}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?set R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET:-terra-backups}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
    volumes:
      - ./cron.sh:/infra/cron.sh:ro
      - ./backup.sh:/infra/backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
      - ingest

volumes:
  postgres-data:
